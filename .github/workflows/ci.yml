name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Format check with black
        run: |
          uv run black --check .

      - name: Run tests
        run: |
          uv run pytest -q --maxfail=1

      - name: SCA with safety
        run: |
          uv run safety check || true



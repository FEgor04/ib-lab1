name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv pip install -e .[dev]

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Format check with black
        run: |
          uv run black --check .

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          uv run pytest -q --maxfail=1

      - name: SAST with bandit
        run: |
          uv run bandit -r -lll -q . || true

      - name: SCA with safety
        run: |
          uv run safety check || true



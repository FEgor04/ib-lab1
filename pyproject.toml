[project]
name = "ib-lab1"
version = "0.1.0"
description = "Secure FastAPI REST API with CI/CD and security scanning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Student", email = "student@example.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",
  "passlib[bcrypt]>=1.7.4",
  "PyJWT>=2.8.0",
  "bleach>=6.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "bandit>=1.7.9",
  "safety>=3.2.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


